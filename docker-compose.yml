services:

  nginx-upload:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      PROJECT_FOLDER: ${PROJECT_FOLDER}
      API_KEY: ${API_KEY}

    volumes:
      - uploads:/data/uploads

    expose:
      - "80"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://127.0.0.1/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  uploads:
    driver: local